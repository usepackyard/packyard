# Versioned release workflow. Fires on v* tag push.
#
# Produces (per tag):
#   packyard-<tag>-linux-amd64.tar.gz   (the one and only binary tarball)
#   SHA256SUMS                          (covers it)
#
# plus:
#   - GHCR Docker image tagged with {version}, {major.minor}, {major}
#   - GitHub Release with generated notes
#
# Prerelease detection: any tag containing `-` (semver pre-release
# identifier — `-alpha`, `-beta`, `-rc`) is flagged as prerelease. Stable
# `vX.Y.Z` tags ship as full releases. install.sh resolves "latest" via
# the GitHub `/releases` list API (which includes prereleases) rather
# than the `/releases/latest/download/…` redirect (which skips them), so
# pre-1.0 betas can correctly carry the pre-release badge and still be
# installable through `curl | sh`.
#
# The build + push happen in a single job so BuildKit's local builder
# cache serves the second invocation (image push) from state produced
# by the first (binary extract) — stages 1+2 run once, not twice.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-push:
    name: build + push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # Pass 1: build through the `export` target and pull the binary
      # out to a local directory so we can tar it up for the release.
      - name: Extract binary
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --target export \
            --build-arg VERSION=${{ github.ref_name }} \
            --output type=local,dest=./out \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            .

      - name: Package tarball
        run: |
          mkdir -p dist
          install -m 0755 out/packyard dist/packyard
          # Version-pinned tarball — install.sh resolves the tag name
          # via the GitHub API and downloads this exact asset. Users
          # pinning with --version <tag> hit the same file.
          tar -czf "dist/packyard-${GITHUB_REF_NAME}-linux-amd64.tar.gz" -C dist packyard
          rm dist/packyard

      # Pass 2: build the full image (runtime stage) and push to GHCR.
      # Every layer up through `export` is already in BuildKit's local
      # cache from pass 1, so this step effectively just materialises
      # the runtime stage + push.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/upload-artifact@v4
        with:
          name: bin-linux-amd64
          path: dist/*.tar.gz
          retention-days: 1

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
    steps:
      # Filter so we only pull the binary artifact, not the build-record
      # metadata the docker/build-push-action uploads as a side effect.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: bin-linux-*

      - name: Compute checksums
        run: |
          cd dist
          sha256sum packyard-*.tar.gz | tee SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Any tag containing `-` is a semver pre-release identifier.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
